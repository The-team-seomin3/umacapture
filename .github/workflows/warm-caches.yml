name: Warm caches

# Classify each master push on Linux. Only nonportable changes refresh the dependency
# caches that ci.yml's pull-request runs restore. Eligible guidance and portable
# CLI pushes skip Windows warming. PR CI handles test execution.
#
# WHY THE CACHES STILL NEED A RUN ON master. A run can restore caches created on its own branch or
# on the default branch, and a pull request's run also those of its base branch; a cache a pull
# request's run creates is scoped to that pull request's merge ref and no other pull request can
# restore it. Caches unused for 7 days are evicted. So without a run on master, each pull request's
# first run would miss and rebuild every cache (the Flutter SDK alone is ~1.8 GB), and a pubspec.lock
# change would leave every later pull request missing the pub cache. A push that finds a cache
# already saved restores it, which is what keeps it from being evicted, and saves nothing.
#
# WHAT IS WARMED, AND HOW IT STAYS THE SAME CACHE. A restore matches only when both the key and the
# cache version agree, and the version is a hash of the cached paths and the compression method.
# Every cache warmed here is defined once, in an action under .github/actions/, and ci.yml's jobs
# restore it through that same action -- so the key and the path cannot differ between the two
# workflows. The compression method is the runner's (and Windows caches are additionally marked
# Windows-only), so this job runs on the same image as the ci.yml jobs that restore them:
# windows-2022. Change both together.
#
# NOT WARMED: build_runner's incremental state (.dart_tool/build, restored only by ci.yml's
# flutter-static job). Filling it means running the whole code generation step, and measured PR runs
# showed no difference in that step's time between a hit and a miss. uv's own cache (native-tests'
# `Set up uv`) holds nothing, because the scripts it runs are stdlib-only.
on:
  push:
    branches: [master]

jobs:
  scope:
    name: Classify push scope (Linux)
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.classify.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the complete master push
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: python3 tool/ci/pr_scope.py classify --push --base "$BEFORE_SHA" --head "$AFTER_SHA"

  warm:
    name: Warm dependency caches
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    # Only pushes that need warming compete for the Windows cache job.
    concurrency:
      group: warm-caches-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK and pub cache
        uses: ./.github/actions/setup-flutter

      - name: OpenCV
        uses: ./.github/actions/provision-opencv

      - name: FFmpeg
        uses: ./.github/actions/provision-ffmpeg

      - name: Web dependencies
        uses: ./.github/actions/provision-web-deps
